[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-rag"
version = "0.1.0"
description = "Keyword -> DOI -> Zotero import for literature deep search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "translatepy>=2.3",
]

[project.optional-dependencies]
web = ["pyzotero>=1.5.10"]

[project.scripts]
litrag = "literature_rag.cli:main"

[tool.setuptools.packages.find]
include = ["literature_rag*"]
